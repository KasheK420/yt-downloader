name: Bug report
description: Report a reproducible problem
labels: [bug]
body:
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include format, quality, app version, and whether you use Docker. Do not share private video URLs or cookies.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Error code, screenshot, browser/OS, or relevant logs without credentials.
