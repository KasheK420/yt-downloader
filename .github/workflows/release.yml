name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version matching pyproject.toml, for example 0.1.0"
        required: true
permissions:
  contents: read
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate version and successful CI for this commit
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os, re, tomllib
          version = os.environ['VERSION']
          assert re.fullmatch(r'\d+\.\d+\.\d+', version), 'Invalid version'
          assert tomllib.load(open('pyproject.toml', 'rb'))['project']['version'] == version
          PY
          gh run list --workflow ci.yml --commit "$GITHUB_SHA" --status success --json databaseId --jq 'length' | grep -qv '^0$'
      - name: Build and publish versioned container
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker build --pull -t "$IMAGE:$VERSION" .
          docker push "$IMAGE:$VERSION"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes
