[project]
name = "yt-downloader"
version = "0.3.1"
description = "A self-hosted YouTube, Facebook and Instagram video and MP3 downloader."
readme = "README.md"
requires-python = ">=3.13,<3.15"
license = "MIT"
authors = [{ name = "Lukas Majoros" }]
dependencies = [
  "fastapi>=0.118,<1",
  "uvicorn>=0.37,<1",
  "pydantic-settings>=2.11,<3",
  "itsdangerous>=2.2,<3",
  "filelock>=3.19,<4",
  "yt-dlp[curl-cffi,default]>=2026.8.19",
  "authlib>=1.8,<2",
  "httpx2>=2.13.1,<3",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.2,<2",
  "pytest-cov>=7,<8",
  "httpx>=0.28,<1",
  "ruff>=0.13,<1",
  "mypy>=1.18,<2",
  "pip-audit>=2.9,<3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [".local"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
platform = "linux"
strict = true
files = ["app"]

[[tool.mypy.overrides]]
module = ["yt_dlp.*", "authlib.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["app"]
omit = ["app/worker.py"]

[tool.coverage.report]
show_missing = true
